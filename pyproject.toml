[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tam400-vehicle-fuel-efficiency"
version = "0.1.0"
description = "TAM400 project for predicting vehicle fuel efficiency from UCI Auto MPG."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["ml/src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/01_vehicle_fuel_efficiency_lab_style.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ml/src", "."]
