project:
  name: TAM400 Vehicle Fuel Efficiency
  model_version_prefix: linear

paths:
  raw_data: data/raw/auto-mpg.data
  interim_data: data/interim/auto-mpg.csv
  model: artifacts/models/model.joblib
  model_card: artifacts/models/model_card.json
  metrics: artifacts/metrics/latest_metrics.json
  comparison: artifacts/metrics/model_comparison.csv
  experiments: artifacts/experiments/experiments.jsonl
  figures_dir: artifacts/figures

data:
  download_if_missing: true
  test_size: 0.2
  random_state: 42

features:
  target: mpg
  numeric:
    - cylinders
    - displacement
    - horsepower
    - weight
    - acceleration
    - model_year
  categorical:
    - origin
  dropped:
    - car_name

training:
  final_model: linear_regression
  cv_folds: 5
  n_jobs: -1
  tune_random_forest: false

